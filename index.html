<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Robot Simulator</title>

  <!-- PyScript -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

  <!-- Blockly -->
  <script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/javascript_compressed.js"></script>

  <!-- JSZip (for .llsp3 read/write) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- Monaco Editor -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Loading overlay (while PyScript / MicroPython downloads) -->
<div id="py-loading">
  <div class="loading-logo">
    <div class="logo-mark">🤖</div>
    <span>Virtual Robot</span>
  </div>
  <div class="loading-bar-wrap">
    <div class="loading-bar"></div>
  </div>
  <span class="loading-text">Loading MicroPython runtime…</span>
</div>

<!-- ── Header ──────────────────────────────────────────── -->
<header>
  <div class="app-logo">
    <div class="logo-mark">🤖</div>
  </div>

  <!-- File actions: three icon-only buttons (New / Open / Save) replacing the
       former File ▾ dropdown. The project-name input stays inline so it's
       always visible. file-open-input is the hidden <input type=file> the
       Open button trips. IDs are preserved so llsp3_ui.js wiring is intact. -->
  <div class="file-actions" id="file-actions">
    <div class="project-name-field">
      <span class="project-type-badge" id="project-type-badge" data-type="blocks" aria-live="polite" title="Blocks project">🧱</span>
      <input type="text" id="project-name" class="project-name-input" placeholder="Untitled-Project" maxlength="64" aria-label="Project name">
    </div>
    <input type="file" id="file-open-input" accept=".llsp3" style="display:none">
    <div class="new-menu" id="new-menu">
      <button class="btn btn-icon-file" id="btn-new" type="button"
              aria-haspopup="true" aria-expanded="false"
              title="New project" aria-label="New project">📄</button>
      <div class="new-menu-pop" id="new-menu-pop" role="menu" aria-labelledby="btn-new">
        <button class="new-menu-item" id="btn-new-python" role="menuitem" type="button">
          <span aria-hidden="true">🐍</span> New Python project
        </button>
        <button class="new-menu-item" id="btn-new-blocks" role="menuitem" type="button">
          <span aria-hidden="true">🧱</span> New Blocks project
        </button>
      </div>
    </div>
    <button class="btn btn-icon-file" id="btn-open" type="button" title="Open .llsp3 file" aria-label="Open project">📂</button>
    <button class="btn btn-icon-file" id="btn-save" type="button" title="Save project" aria-label="Save project">💾</button>
  </div>

  <div class="spacer"></div>

  <div class="header-controls">

    <div class="settings-menu" id="settings-menu">
      <button class="btn btn-settings" id="settings-trigger" type="button" aria-haspopup="true" aria-expanded="false" title="Settings">
        <span class="settings-gear" aria-hidden="true">⚙</span> Settings
      </button>
      <div class="settings-pop" id="settings-pop" role="menu" aria-labelledby="settings-trigger">
        <h3>Settings</h3>
        <div class="sensor-row">
          <span class="sensor-label">Theme</span>
          <button class="btn btn-theme" id="btn-theme" title="Toggle light/dark theme" aria-label="Toggle theme">
            <span class="icon-moon">🌙</span><span class="icon-sun">☀️</span>
          </button>
        </div>
        <div class="sensor-row">
          <span class="sensor-label">Units</span>
          <select id="units-select" class="units-select" aria-label="Position units">
            <option value="cm">cm</option>
            <option value="mm">mm</option>
            <option value="in">in</option>
          </select>
        </div>
        <button class="btn btn-reset" id="btn-defaults" title="Reset theme, speed, and editor contents to defaults">⟲ Reset to defaults</button>
      </div>
    </div>
    <a class="btn btn-support" id="btn-support" href="https://go.sanadfoundation.ca/support-fll-tooling-efforts" target="_blank" rel="noopener noreferrer" title="Support development of this simulator">
      <span class="btn-support-icon" aria-hidden="true">❤️</span>
      Support
    </a>
    <a class="btn btn-github btn-github-iconly" id="btn-github" href="https://github.com/sanadfoundation/fll-virtual-robot" target="_blank" rel="noopener noreferrer" title="View source on GitHub" aria-label="View source on GitHub">
      <svg class="btn-github-mark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </div>
</header>

<!-- ── Main body ────────────────────────────────────────── -->
<div class="app-body">

  <!-- Left panel: editor -->
  <div class="panel-left">
    <div class="editor-wrap">
      <div id="py-editor-wrap" style="height:100%">
        <div id="py-editor" style="height:100%"></div>
      </div>
      <div id="blockly-div"></div>
    </div>
  </div>

  <!-- Resize handle (drag to resize) with an inline collapse/expand button.
       The button toggles .panel-left.collapsed so the canvas can take the
       full horizontal width. Wired in js/main.js (initResizeHandle); the
       button stops drag-mousedown from bubbling to the resize handler. -->
  <div class="resize-handle" id="resize-handle">
    <button class="resize-collapse-btn" id="resize-collapse-btn"
            type="button"
            aria-label="Collapse editor panel"
            aria-pressed="false"
            title="Collapse editor panel">
      <span class="resize-collapse-icon" aria-hidden="true">◀</span>
    </button>
  </div>

  <!-- Right panel: canvas + console. Status (Position, Motors, Sensors) is
       overlaid on the canvas top-left as a packing toolbar (see
       .canvas-toolbar below). The toolbar collapses into a single circle on
       demand so the canvas can use the full panel height. -->
  <div class="panel-right">

    <div class="canvas-wrap">
      <canvas id="robot-canvas"></canvas>
      <div id="canvas-hover" hidden></div>

      <!-- Status toolbar: three pill buttons (Position / Motors / Sensors)
           that open anchored popovers, plus a circle handle that packs the
           row into a single matching circle. Both the pack handle (inside
           the pills row) and the unpack handle (the single circle shown
           when packed) share .canvas-circle styling so they read as the
           same control in two states. data-state on .canvas-toolbar drives
           the cross-fade between the two layers. -->
      <div class="canvas-toolbar" id="canvas-toolbar" data-state="expanded">

        <div class="canvas-toolbar-pills" role="toolbar" aria-label="Robot status">
          <button class="canvas-pill" id="pb-position" type="button" aria-haspopup="true" aria-expanded="false" data-active="false">
            <span class="pip" aria-hidden="true"></span>
            📍 Position
          </button>
          <button class="canvas-pill" id="pb-motors" type="button" aria-haspopup="true" aria-expanded="false" data-active="false">
            <span class="pip" aria-hidden="true"></span>
            🛞 Motors <span class="label-port">A · B</span>
          </button>
          <button class="canvas-pill" id="pb-sensors" type="button" aria-haspopup="true" aria-expanded="false" data-active="false">
            <span class="pip" aria-hidden="true"></span>
            🎯 Sensors <span class="label-port">C · D · E</span>
          </button>
          <button class="canvas-circle canvas-circle-pack" id="canvas-pack-handle" type="button" aria-label="Pack status toolbar" title="Collapse status toolbar">
            <span class="canvas-circle-icon" aria-hidden="true">‹</span>
          </button>
        </div>

        <button class="canvas-circle canvas-circle-unpack" id="canvas-unpack-handle" type="button" aria-label="Unpack status toolbar" title="Show Position / Motors / Sensors" data-active="false">
          <span class="canvas-circle-icon canvas-circle-dots" aria-hidden="true">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </span>
        </button>
      </div>

      <!-- Popovers. Anchored under the pills row when expanded; force-closed
           by the pack action. Chip / pose IDs are unchanged so the
           simulator's writes (port-value-A..E, color-swatch, port-force-
           fill-E, sp-x/y/heading/yaw) keep working. The force chip is still
           a <button> so main.js's pointer bindings on #port-force-E find it
           in its new home. -->
      <div class="canvas-pop" id="pop-position" role="region" aria-label="Position">
        <span class="canvas-pop-title">Position</span>
        <div class="cstat-pose" title="Horizontal position from the left edge of the field">
          <span class="cstat-pose-label">X</span>
          <span class="cstat-pose-value" id="sp-x">—</span>
        </div>
        <div class="cstat-pose" title="Vertical position from the bottom edge of the field">
          <span class="cstat-pose-label">Y</span>
          <span class="cstat-pose-value" id="sp-y">—</span>
        </div>
        <div class="cstat-pose" title="Direction the robot is facing (0° = east, 90° = north)">
          <span class="cstat-pose-label">Heading</span>
          <span class="cstat-pose-value" id="sp-heading">—</span>
        </div>
        <div class="cstat-pose" title="Net rotation since the last reset_yaw_angle() call">
          <span class="cstat-pose-label">Yaw</span>
          <span class="cstat-pose-value" id="sp-yaw">—</span>
        </div>
      </div>

      <div class="canvas-pop" id="pop-motors" role="region" aria-label="Motors">
        <span class="canvas-pop-title">Motors</span>
        <div class="cstat-chip" id="port-row-A" title="Light motor on port A — left drive wheel; value is current rotation">
          <span class="cstat-chip-icon" aria-hidden="true">A</span>
          <span class="cstat-chip-meta">
            <span class="cstat-chip-head">
              <span class="cstat-chip-role">Left</span>
            </span>
            <span class="cstat-chip-value" id="port-value-A">0°/s  0.0↻</span>
          </span>
        </div>
        <div class="cstat-chip" id="port-row-B" title="Light motor on port B — right drive wheel; value is current rotation">
          <span class="cstat-chip-icon" aria-hidden="true">B</span>
          <span class="cstat-chip-meta">
            <span class="cstat-chip-head">
              <span class="cstat-chip-role">Right</span>
            </span>
            <span class="cstat-chip-value" id="port-value-B">0°/s  0.0↻</span>
          </span>
        </div>
      </div>

      <div class="canvas-pop" id="pop-sensors" role="region" aria-label="Sensors">
        <span class="canvas-pop-title">Sensors</span>
        <div class="cstat-chip cstat-chip-color" id="port-row-C" title="Color sensor on port C — reads the colour under the robot">
          <span class="cstat-chip-icon" aria-hidden="true">C</span>
          <span class="cstat-chip-meta">
            <span class="cstat-chip-head">
              <span class="cstat-chip-role">Color</span>
            </span>
            <span class="cstat-chip-value" id="port-value-C">none</span>
          </span>
          <span class="sensor-color-swatch" id="color-swatch"></span>
        </div>
        <div class="cstat-chip" id="port-row-D" title="Distance sensor on port D — reads how far the nearest object is">
          <span class="cstat-chip-icon" aria-hidden="true">D</span>
          <span class="cstat-chip-meta">
            <span class="cstat-chip-head">
              <span class="cstat-chip-role">Distance</span>
            </span>
            <span class="cstat-chip-value" id="port-value-D">—</span>
          </span>
        </div>
        <!-- Force chip is the press-and-hold button itself. port-force-fill-E
             is the bottom progress bar that simulator.js animates. -->
        <button class="cstat-chip cstat-chip-force" id="port-force-E" type="button"
                title="Force sensor on port E — press &amp; hold to apply force"
                aria-label="Apply force on the sensor at port E">
          <span class="cstat-chip-icon" aria-hidden="true">E</span>
          <span class="cstat-chip-meta">
            <span class="cstat-chip-head">
              <span class="cstat-chip-role">Force</span>
            </span>
            <span class="cstat-chip-value" id="port-value-E">0.0 N</span>
          </span>
          <span class="port-force-fill" id="port-force-fill-E"></span>
        </button>
      </div>
    </div>

    <div class="console-wrap" id="console-wrap">
      <button class="console-header" id="console-toggle" type="button" aria-expanded="true" aria-controls="console-output">
        <span class="dot"></span>
        <span class="console-header-label">Console Output</span>
        <span class="console-spacer"></span>
        <span class="console-toggle-chevron" aria-hidden="true">▾</span>
      </button>
      <div id="console-output"></div>
    </div>
  </div>

</div>

<!-- ── Bottom dock (primary actions on the left, speed centred, status on the right) ─── -->
<div class="status-bar bottom-dock">
  <div class="dock-actions">
    <button class="btn btn-run  btn-icon-only" id="btn-run"   disabled title="Run (Ctrl+Enter)" aria-label="Run">
      <span class="dock-icon" aria-hidden="true">▶</span>
    </button>
    <button class="btn btn-stop btn-icon-only" id="btn-stop"  disabled title="Stop" aria-label="Stop">
      <span class="dock-icon" aria-hidden="true">■</span>
    </button>
    <button class="btn btn-reset btn-icon-only" id="btn-reset" title="Start over — reset robot to spawn" aria-label="Start over">
      <span class="dock-icon" aria-hidden="true">↺</span>
    </button>
  </div>
  <div class="dock-speed" title="Simulation speed multiplier">
    <span class="dock-speed-label">Speed</span>
    <input type="range" id="speed-slider" min="0.25" max="4" step="0.25" value="1" aria-label="Simulation speed">
    <span id="speed-label">1x</span>
  </div>
  <div class="spacer"></div>
  <div class="status-item">
    <span class="status-dot ready" id="status-dot"></span>
    <span id="status-label">Ready</span>
  </div>
</div>

<script>
// Settings popover — gear button in the header top-right opens a floating
// pane containing Speed / Theme / Units / Defaults. All inner element IDs
// stay the same (speed-slider, btn-theme, units-select, btn-defaults), so
// the wiring in main.js / monaco_config.js / simulator.js stays intact.
(function () {
  const trigger = document.getElementById('settings-trigger');
  const pop = document.getElementById('settings-pop');
  if (!trigger || !pop) return;
  function close() {
    pop.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
  }
  function open() {
    pop.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
  }
  trigger.addEventListener('click', e => {
    e.stopPropagation();
    pop.classList.contains('open') ? close() : open();
  });
  document.addEventListener('click', e => {
    if (!pop.contains(e.target) && e.target !== trigger && !trigger.contains(e.target)) close();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && pop.classList.contains('open')) close();
  });
})();
</script>

<script>
// New-project menu — split button next to the file actions. Click 📄 to
// toggle the popover; click an item to dispatch handleNewProject(type)
// (wired from main.js). Outside-click and Escape close it, mirroring the
// settings popover behaviour right above this block.
(function () {
  const trigger = document.getElementById('btn-new');
  const pop     = document.getElementById('new-menu-pop');
  if (!trigger || !pop) return;
  function close() {
    pop.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
  }
  function open() {
    pop.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
  }
  trigger.addEventListener('click', e => {
    e.stopPropagation();
    pop.classList.contains('open') ? close() : open();
  });
  pop.addEventListener('click', e => {
    // Any click on an item closes the menu; the item's own listener (wired
    // in main.js) actually dispatches handleNewProject.
    if (e.target.closest('.new-menu-item')) close();
  });
  document.addEventListener('click', e => {
    if (!pop.contains(e.target) && e.target !== trigger && !trigger.contains(e.target)) close();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && pop.classList.contains('open')) {
      close();
      trigger.focus();
    }
  });
})();
</script>

<script>
// Console collapse — click the header to fold/unfold the output panel.
// State persists across reloads via localStorage so kids who like a tall
// canvas keep their preference.
(function () {
  const wrap = document.getElementById('console-wrap');
  const toggle = document.getElementById('console-toggle');
  if (!wrap || !toggle) return;
  const KEY = 'fll-console-collapsed';
  function apply(collapsed) {
    wrap.classList.toggle('collapsed', collapsed);
    toggle.setAttribute('aria-expanded', String(!collapsed));
  }
  apply(localStorage.getItem(KEY) === '1');
  toggle.addEventListener('click', () => {
    const next = !wrap.classList.contains('collapsed');
    apply(next);
    localStorage.setItem(KEY, next ? '1' : '0');
  });
})();

// Canvas status toolbar — Position / Motors / Sensors pills with anchored
// popovers, plus a pack/unpack toggle that cross-fades the pill row into a
// single circle. Only one popover open at a time. Outside-click and Escape
// close them. Packing force-closes any open popover. The unpack circle
// pulses a green ring when any underlying value changes so the user knows
// when to unpack and look.
(function () {
  const pairs = [
    ['pb-position', 'pop-position'],
    ['pb-motors',   'pop-motors'],
    ['pb-sensors',  'pop-sensors'],
  ];
  const buttons   = pairs.map(([b, _]) => document.getElementById(b));
  const pops      = pairs.map(([_, p]) => document.getElementById(p));
  const toolbar   = document.getElementById('canvas-toolbar');
  const packBtn   = document.getElementById('canvas-pack-handle');
  const unpackBtn = document.getElementById('canvas-unpack-handle');
  if (!toolbar || !packBtn || !unpackBtn || buttons.some(b => !b) || pops.some(p => !p)) return;
  const STATE_KEY = 'fll-canvas-toolbar-state';

  function closeAllPops() {
    pops.forEach((p, i) => {
      p.classList.remove('open');
      buttons[i].setAttribute('aria-expanded', 'false');
    });
  }
  function openOnly(i) {
    pops.forEach((p, j) => {
      const open = i === j;
      p.classList.toggle('open', open);
      buttons[j].setAttribute('aria-expanded', String(open));
    });
  }
  function setState(state) {
    toolbar.setAttribute('data-state', state);
    if (state === 'packed') closeAllPops();
    localStorage.setItem(STATE_KEY, state);
  }
  setState(localStorage.getItem(STATE_KEY) === 'packed' ? 'packed' : 'expanded');

  packBtn.addEventListener('click', e => { e.stopPropagation(); setState('packed'); });
  unpackBtn.addEventListener('click', e => { e.stopPropagation(); setState('expanded'); });

  pairs.forEach((_, i) => {
    buttons[i].addEventListener('click', e => {
      e.stopPropagation();
      if (toolbar.getAttribute('data-state') === 'packed') return;
      pops[i].classList.contains('open') ? closeAllPops() : openOnly(i);
    });
  });

  document.addEventListener('click', e => {
    if (buttons.some(b => b.contains(e.target))) return;
    if (pops.some(p => p.contains(e.target))) return;
    closeAllPops();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllPops(); });

  // Activity indicators. Each pill lights its own pip when its underlying
  // values change; the unpack circle lights its outer ring whenever any
  // value changes (so it works as a status indicator while packed).
  const watchers = [
    { btn: buttons[0], ids: ['sp-x'] },
    { btn: buttons[1], ids: ['port-value-A', 'port-value-B'] },
    { btn: buttons[2], ids: ['port-value-C', 'port-value-D', 'port-value-E'] },
  ];
  const last = watchers.map(w => w.ids.map(id => (document.getElementById(id) || {}).textContent || ''));
  let circleTimer;
  setInterval(() => {
    let anyChanged = false;
    watchers.forEach((w, i) => {
      let changed = false;
      w.ids.forEach((id, k) => {
        const cur = (document.getElementById(id) || {}).textContent || '';
        if (cur !== last[i][k]) { changed = true; last[i][k] = cur; }
      });
      if (changed) {
        anyChanged = true;
        w.btn.setAttribute('data-active', 'true');
        clearTimeout(w._t);
        w._t = setTimeout(() => w.btn.setAttribute('data-active', 'false'), 700);
      }
    });
    if (anyChanged) {
      unpackBtn.setAttribute('data-active', 'true');
      clearTimeout(circleTimer);
      circleTimer = setTimeout(() => unpackBtn.setAttribute('data-active', 'false'), 700);
    }
  }, 250);
})();
</script>
