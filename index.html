<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLL Virtual Robot Simulator</title>

  <!-- PyScript -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

  <!-- Blockly -->
  <script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/javascript_compressed.js"></script>

  <!-- JSZip (for .llsp3 read/write) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- Monaco Editor -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Loading overlay (while PyScript / MicroPython downloads) -->
<div id="py-loading">
  <div class="loading-logo">
    <div class="logo-mark">🤖</div>
    <span><span class="fll">FLL</span> Virtual Robot</span>
  </div>
  <div class="loading-bar-wrap">
    <div class="loading-bar"></div>
  </div>
  <span class="loading-text">Loading MicroPython runtime…</span>
</div>

<!-- ── Header ──────────────────────────────────────────── -->
<header>
  <div class="app-logo">
    <div class="logo-mark">🤖</div>
    <h1><span class="fll">FLL</span></h1>
  </div>

  <div class="file-menu" id="file-menu">
    <button class="btn btn-file file-trigger" id="file-trigger" type="button" aria-haspopup="true" aria-expanded="false" title="Project menu">
      📁 File <span class="caret">▾</span>
    </button>
    <div class="file-pop" id="file-pop" role="menu">
      <div class="file-pop-label">Project name</div>
      <div class="file-pop-name">
        <span class="project-name-icon">📝</span>
        <input type="text" id="project-name" class="project-name-input" placeholder="Untitled-Project" maxlength="64">
      </div>
      <div class="file-pop-divider"></div>
      <input type="file" id="file-open-input" accept=".llsp3" style="display:none">
      <button class="file-pop-item" id="btn-open" type="button">📂 Open .llsp3…</button>
      <button class="file-pop-item" id="btn-save" type="button">💾 Save project</button>
    </div>
  </div>

  <div class="tab-group">
    <button class="tab-btn active" id="tab-blocks">🧱 Blocks</button>
    <button class="tab-btn"        id="tab-python">🐍 Python</button>
  </div>

  <div class="spacer"></div>

  <div class="header-controls">

    <!-- Position popover: live X / Y / Heading / Yaw Change. Toggle by clicking
         the button or pressing Escape; stays open while the user interacts with
         the canvas so values can be monitored during a run. -->
    <div class="hub-menu" id="hub-menu-position">
      <button class="btn btn-hub" id="hub-trigger-position" type="button" aria-haspopup="true" aria-expanded="false" title="Live position">
        <span class="hub-icon" aria-hidden="true">📍</span> Position
      </button>
      <div class="hub-pop" id="hub-pop-position" role="region" aria-labelledby="hub-trigger-position">
        <h3 class="hub-pop-title">Position</h3>
        <div class="hub-stat" title="Horizontal position from the left edge of the field">
          <span class="sensor-label">X</span>
          <span class="sensor-value" id="sp-x">—</span>
        </div>
        <div class="hub-stat" title="Vertical position from the bottom edge of the field">
          <span class="sensor-label">Y</span>
          <span class="sensor-value" id="sp-y">—</span>
        </div>
        <div class="hub-stat" title="Direction the robot is facing (0° = east, 90° = north)">
          <span class="sensor-label">Heading</span>
          <span class="sensor-value" id="sp-heading">—</span>
        </div>
        <div class="hub-stat" title="Net rotation since the last reset_yaw_angle() call">
          <span class="sensor-label">Yaw Change</span>
          <span class="sensor-value" id="sp-yaw">—</span>
        </div>
      </div>
    </div>

    <!-- Ports popover: live per-port readout (A-F). Same toggle semantics as
         the Position popover. The force button on port E lives inside the
         pane so it's reachable while monitoring. -->
    <div class="hub-menu" id="hub-menu-ports">
      <button class="btn btn-hub" id="hub-trigger-ports" type="button" aria-haspopup="true" aria-expanded="false" title="Live port state">
        <span class="hub-icon" aria-hidden="true">🔌</span> Ports
      </button>
      <div class="hub-pop" id="hub-pop-ports" role="region" aria-labelledby="hub-trigger-ports">
        <h3 class="hub-pop-title">Ports</h3>
        <div class="port-row" id="port-row-A" title="Light motor — left drive wheel; value is current rotation">
          <span class="port-letter">A</span>
          <span class="port-device">Motor (left)</span>
          <span class="port-value" id="port-value-A">0°</span>
        </div>
        <div class="port-row" id="port-row-B" title="Light motor — right drive wheel; value is current rotation">
          <span class="port-letter">B</span>
          <span class="port-device">Motor (right)</span>
          <span class="port-value" id="port-value-B">0°</span>
        </div>
        <div class="port-row" id="port-row-C" title="Color sensor — reads the colour under the robot">
          <span class="port-letter">C</span>
          <span class="port-device">Color sensor</span>
          <span class="port-value" id="port-value-C">none</span>
          <span class="sensor-color-swatch" id="color-swatch"></span>
        </div>
        <div class="port-row" id="port-row-D" title="Distance sensor — reads how far the nearest object is">
          <span class="port-letter">D</span>
          <span class="port-device">Distance sensor</span>
          <span class="port-value" id="port-value-D">—</span>
        </div>
        <div class="port-row port-row-with-action" id="port-row-E" title="Force sensor — press &amp; hold the button to apply force">
          <span class="port-letter">E</span>
          <span class="port-device">Force sensor</span>
          <span class="port-value" id="port-value-E">0.0 N</span>
          <button class="port-force-button" id="port-force-E" type="button"
                  aria-label="Apply force on the sensor at port E">
            <span class="port-force-fill" id="port-force-fill-E"></span>
            <span class="port-force-label">Press &amp; hold to apply</span>
          </button>
        </div>
        <div class="port-row empty" id="port-row-F" title="Empty port — no device attached">
          <span class="port-letter">F</span>
          <span class="port-device">Empty</span>
          <span class="port-value" id="port-value-F"></span>
        </div>
      </div>
    </div>

    <div class="settings-menu" id="settings-menu">
      <button class="btn btn-settings" id="settings-trigger" type="button" aria-haspopup="true" aria-expanded="false" title="Settings">
        <span class="settings-gear" aria-hidden="true">⚙</span> Settings
      </button>
      <div class="settings-pop" id="settings-pop" role="menu" aria-labelledby="settings-trigger">
        <h3>Settings</h3>
        <div class="speed-control">
          <span>Speed</span>
          <input type="range" id="speed-slider" min="0.25" max="4" step="0.25" value="1">
          <span id="speed-label">1x</span>
        </div>
        <div class="sensor-row">
          <span class="sensor-label">Theme</span>
          <button class="btn btn-theme" id="btn-theme" title="Toggle light/dark theme" aria-label="Toggle theme">
            <span class="icon-moon">🌙</span><span class="icon-sun">☀️</span>
          </button>
        </div>
        <div class="sensor-row">
          <span class="sensor-label">Units</span>
          <select id="units-select" class="units-select" aria-label="Position units">
            <option value="cm">cm</option>
            <option value="mm">mm</option>
            <option value="in">in</option>
          </select>
        </div>
        <button class="btn btn-reset" id="btn-defaults" title="Reset theme, speed, and editor contents to defaults">⟲ Reset to defaults</button>
      </div>
    </div>
    <a class="btn btn-github" id="btn-github" href="https://github.com/sanadfoundation/fll-virtual-robot" target="_blank" rel="noopener noreferrer" title="View source on GitHub">
      <svg class="btn-github-mark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      GitHub
    </a>
  </div>
</header>

<!-- ── Main body ────────────────────────────────────────── -->
<div class="app-body">

  <!-- Left panel: editor -->
  <div class="panel-left">
    <div class="editor-wrap">
      <div id="py-editor-wrap" style="height:100%">
        <div id="py-editor" style="height:100%"></div>
      </div>
      <div id="blockly-div"></div>
    </div>
  </div>

  <!-- Resize handle -->
  <div class="resize-handle" id="resize-handle"></div>

  <!-- Right panel: canvas + console. Position and Ports live in floating
       popovers anchored to top-bar buttons (see <header>); they overlay the
       canvas rather than consuming vertical space. -->
  <div class="panel-right">

    <div class="canvas-wrap">
      <canvas id="robot-canvas"></canvas>
      <div id="canvas-hover" hidden></div>
    </div>

    <div class="console-wrap" id="console-wrap">
      <button class="console-header" id="console-toggle" type="button" aria-expanded="true" aria-controls="console-output">
        <span class="dot"></span>
        <span class="console-header-label">Console Output</span>
        <span class="console-spacer"></span>
        <span class="console-toggle-chevron" aria-hidden="true">▾</span>
      </button>
      <div id="console-output"></div>
    </div>
  </div>

</div>

<!-- ── Bottom dock (primary actions on the left, status indicator on the right) ─── -->
<div class="status-bar bottom-dock">
  <div class="dock-actions">
    <button class="btn btn-run"   id="btn-run"   disabled title="Ctrl+Enter to run">▶ Run</button>
    <button class="btn btn-stop"  id="btn-stop"  disabled>■ Stop</button>
    <button class="btn btn-reset" id="btn-reset" title="Reset robot to spawn">↺ Reset</button>
  </div>
  <div class="spacer"></div>
  <div class="status-item">
    <span class="status-dot ready" id="status-dot"></span>
    <span id="status-label">Ready</span>
  </div>
</div>

<script src="js/force_sensor_logic.js"></script>
<script src="js/ruler.js"></script>
<script src="js/simulator.js"></script>
<script src="js/blockly_config.js"></script>
<script src="js/monaco_config.js"></script>
<script src="js/llsp3_assets.js"></script>
<script src="js/llsp3_manifest.js"></script>

<script src="js/llsp3_io.js"></script>

<script>window.versionCheck && window.versionCheck.init();</script>

<!-- File menu popover — toggle + outside-click close. The Open/Save/Project-name
     elements inside keep their original IDs, so the wiring in llsp3_ui.js stays
     intact. Closes the popover when the user picks an item or clicks outside. -->
<script>
(function () {
  const trigger = document.getElementById('file-trigger');
  const pop = document.getElementById('file-pop');
  if (!trigger || !pop) return;
  function close() {
    pop.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
  }
  function open() {
    pop.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
  }
  trigger.addEventListener('click', e => {
    e.stopPropagation();
    pop.classList.contains('open') ? close() : open();
  });
  // Click outside closes; clicks on Open/Save fire their handlers AND close.
  document.addEventListener('click', e => {
    if (!pop.contains(e.target) && e.target !== trigger) close();
  });
  // Close on Escape.
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && pop.classList.contains('open')) close();
  });
  // After Open/Save fire their llsp3_ui.js handlers, fold the menu away.
  ['btn-open', 'btn-save'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.addEventListener('click', () => setTimeout(close, 0));
  });
})();

// Settings popover — gear button in the header top-right opens a floating
// pane containing Speed / Theme / Units / Defaults. All inner element IDs
// stay the same (speed-slider, btn-theme, units-select, btn-defaults), so
// the wiring in main.js / monaco_config.js / simulator.js stays intact.
(function () {
  const trigger = document.getElementById('settings-trigger');
  const pop = document.getElementById('settings-pop');
  if (!trigger || !pop) return;
  function close() {
    pop.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
  }
  function open() {
    pop.classList.add('open');
    trigger.setAttribute('aria-expanded', 'true');
  }
  trigger.addEventListener('click', e => {
    e.stopPropagation();
    pop.classList.contains('open') ? close() : open();
  });
  document.addEventListener('click', e => {
    if (!pop.contains(e.target) && e.target !== trigger && !trigger.contains(e.target)) close();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && pop.classList.contains('open')) close();
  });
})();

// Hub popovers (Position / Ports) — same trigger pattern as the Settings
// popover, tuned for live-monitoring during a run: outside clicks do NOT
// close them, so the user can edit code or drag the robot with the
// readouts staying visible. Mutually exclusive — opening one closes the
// other, so the panes never overlap. Toggle by re-clicking the trigger;
// Escape closes whichever is open.
(function () {
  const POPS = [
    { triggerId: 'hub-trigger-position', popId: 'hub-pop-position' },
    { triggerId: 'hub-trigger-ports',    popId: 'hub-pop-ports'    },
  ];
  const wired = POPS.map(({ triggerId, popId }) => {
    const trigger = document.getElementById(triggerId);
    const pop = document.getElementById(popId);
    if (!trigger || !pop) return null;
    return {
      trigger, pop,
      close: () => { pop.classList.remove('open'); trigger.setAttribute('aria-expanded', 'false'); },
      open:  () => { pop.classList.add('open');    trigger.setAttribute('aria-expanded', 'true');  },
    };
  }).filter(Boolean);
  wired.forEach(self => {
    self.trigger.addEventListener('click', e => {
      e.stopPropagation();
      const wasOpen = self.pop.classList.contains('open');
      wired.forEach(w => w.close());
      if (!wasOpen) self.open();
    });
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    wired.forEach(w => { if (w.pop.classList.contains('open')) w.close(); });
  });
})();

// Console collapse — click the header to fold/unfold the output panel.
// State persists across reloads via localStorage so kids who like a tall
// canvas keep their preference.
(function () {
  const wrap = document.getElementById('console-wrap');
  const toggle = document.getElementById('console-toggle');
  if (!wrap || !toggle) return;
  const KEY = 'fll-console-collapsed';
  function apply(collapsed) {
    wrap.classList.toggle('collapsed', collapsed);
    toggle.setAttribute('aria-expanded', String(!collapsed));
  }
  apply(localStorage.getItem(KEY) === '1');
  toggle.addEventListener('click', () => {
    const next = !wrap.classList.contains('collapsed');
    apply(next);
    localStorage.setItem(KEY, next ? '1' : '0');
  });
})();
</script>

</body>
